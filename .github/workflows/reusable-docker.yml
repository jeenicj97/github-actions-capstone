name: Reusable Docker

on:
    workflow_call:
        inputs:
            image_name:
                required: true
                type: string
            tag:
                required: true
                type: string
        secrets:
            docker_username:
                required: true
            
            docker_password:
                required: true

        outputs:
            image_url:
                value: ${{ jobs.build.outputs.image }}
    
jobs:
    build:
        runs-on: ubuntu-latest

        outputs:
            image: ${{ steps.output.outputs.image }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to Docker
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
        
            - name: Build Image
              run: |
                docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }} .

            - name: Push Image
              run: |
                docker push  ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}

            - name: Output Image URL
              id: output
              run: |
                echo "image=${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT