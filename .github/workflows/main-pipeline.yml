name: Main Pipeline

on:
    push:
        branches:
            - main

jobs:
    build-test:
        uses: ./.github/workflows/reusable-build-test.yml
        with:
            python_version: "3.11"
            run_tests: true

    docker:
        needs: build-test
        uses: ./.github/workflows/reusable-docker.yml
        with:
            image_name: gha-capstone
            tag: latest
        secrets:
            docker_username: ${{ secrets.DOCKER_USERNAME }}
            docker_token: ${{ secrets.DOCKER_PASSWORD }}

    docker-sha:
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - name: Build SHA Tag
              run: |
                SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
                echo "Tag = sha-$SHORT_SHA"
    
    deploy:
        needs: docker
        runs-on: ubuntu-latest
        environment: 
            name: production
        steps:
            - run: |
                 echo "Deploying image: ""
                 echo "${{ needs.docker.outputs.image_url }}"
            





